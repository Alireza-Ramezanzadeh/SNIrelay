[package]
name = "snirelay"
version = "0.3.0"
edition = "2021"
description = "SNIrelay — high-performance TLS SNI & HTTP transparent proxy with SOCKS5/HTTP CONNECT upstream (L4 passthrough)"
authors = ["Alireza Ramezanzadeh"]
repository = "https://github.com/Alireza-Ramezanzadeh/SNIrelay"
keywords = ["sni", "proxy", "tls", "socks5", "transparent-proxy", "prometheus"]
license = "MIT"

[[bin]]
name = "snirelay"
path = "src/main.rs"

[dependencies]
# Async runtime (Tokio L4 splice — no TLS termination)
tokio = { version = "1", features = ["full"] }

# Config & CLI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }

# Logging & metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# Admin panel
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
mime_guess = "2"

# Utilities
anyhow = "1"
once_cell = "1"
regex = "1"
libc = "0.2"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
