# SNIrelay configuration
# ─────────────────────────────────────────────────────────────────────────────

# Legacy single upstream (also used as default when `upstreams` is omitted).
upstream_proxy:
  type: socks5
  host: "127.0.0.1"
  port: 10808

# Named upstream profiles. Unmapped clients use `default_upstream`.
# PROXY / --proxy overrides only the default profile.
upstreams:
  middle-east:
    type: socks5
    host: "127.0.0.1"
    port: 10808
  # europe:
  #   type: socks5
  #   host: "10.0.0.2"
  #   port: 1080

default_upstream: middle-east

# Exact client IP → profile name
# client_upstreams:
#   "94.183.122.121": europe
client_upstreams: {}

# If preferred SOCKS fails, try other profiles (default → then others). Off by default.
upstream_failover: false

# Lightweight periodic upstream checks (SOCKS/HTTP handshake only — tiny traffic).
# Prefer secrets via env: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
upstream_monitor:
  enabled: false
  interval_secs: 60
  timeout_secs: 10
  fail_threshold: 2
  recover_threshold: 2
  notify_recovery: true
  notify_cooldown_secs: 600
  # End-to-end HTTPS probe (same idea as: curl --proxy socks5://… https://ifconfig.io)
  # Avoid relying only on Cloudflare — it often still works when the node is half-dead.
  probe_host: "ifconfig.io"
  probe_port: 443
  # Or require several targets (all must succeed):
  # probe_hosts: ["ifconfig.io:443", "example.com:443"]
  # profiles: []   # empty = all non-direct profiles

telegram:
  # bot_token: ""
  # chat_id: ""
  # api_base: "https://api.telegram.org"   # or a proxy mirror

# Client IP whitelist for proxy ports. Empty = allow all. Panel (:9080) is never filtered.
client_whitelist: []
# Sync add/remove to host UFW (`ufw allow/delete from <ip>`). Needs ufw in container/host.
client_whitelist_ufw: true
# ufw_bin: /usr/sbin/ufw

# Listeners: bind address + proto (tls | http). Routing is only via `hosts` below.
listens:
  - name: https
    addr: "0.0.0.0:443"
    proto: tls

  - name: https-alt
    addr: "0.0.0.0:8443"
    proto: tls

  - name: http
    addr: "0.0.0.0:80"
    proto: http

  - name: http-alt
    addr: "0.0.0.0:8080"
    proto: http

# Allowlist + DNS override (sniproxy `table hosts`).
# address: "*" = tunnel to client SNI/Host; or set an IP to override DNS.
# Add { pattern: ".*", address: "*" } at the end to allow every hostname.
hosts:
  - pattern: translate.wordpress.com
    address: 192.0.78.12
  - pattern: downloads.wordpress.org
    address: 198.143.164.250

connect_timeout_secs: 10
# Retry SOCKS/HTTP upstream at startup (Docker/Xray race). Soft-fail by default.
upstream_probe_wait_secs: 60
upstream_probe_interval_secs: 2
upstream_probe_required: false
rw_timeout_secs: 300
workers: 0
nofile_limit: 1048576
max_connections: 50000
listen_backlog: 4096
metrics_addr: "0.0.0.0:9090"
metrics_refresh_secs: 2

# Admin panel (embedded UI + SQLite). Default password: snirelay (or ADMIN_PASSWORD).
panel:
  enabled: true
  addr: "0.0.0.0:9080"
  db_path: "/var/lib/snirelay/panel.db"
  # Public IP inserted into dnsmasq address=/domain/IP lines
  relay_ip: "94.182.174.181"
  # Live-edit host dnsmasq drop-ins (mount /etc/dnsmasq.d into the container)
  dnsmasq_conf_dir: "/etc/dnsmasq.d"
  # Optional explicit files (auto-detected if omitted):
  # dnsmasq_relay_file: "/etc/dnsmasq.d/routed.conf"
  # dnsmasq_bypass_file: "/etc/dnsmasq.d/bypass.conf"
  # Host signal; container wraps this in `nsenter -t 1` automatically when Docker+pid:host
  dnsmasq_reload_cmd: "kill -HUP $(pidof dnsmasq)"
  # AdGuard-style query log: enable in dnsmasq (log-queries + log-facility=file)
  dnsmasq_query_log: "/var/log/dnsmasq/queries.log"
  dns_query_retain_hours: 72
