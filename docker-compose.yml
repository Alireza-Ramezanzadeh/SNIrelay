# SNIrelay — host network (SOCKS on 127.0.0.1 + ports 80/443)
#
# Usage:
#   1. cp config/config.yaml ./snirelay.yaml   # edit upstreams / hosts / panel
#   2. cp .env.sample .env                    # set ADMIN_PASSWORD / RELAY_IP
#   3. docker compose up -d --build
#
# Panel:   http://SERVER:9080/
# Metrics: http://SERVER:9090/metrics
#
# Whitelist → UFW + dnsmasq HUP: uses `nsenter -t 1` into the host
# (needs pid: host + privileged + util-linux in the image).

services:
  snirelay:
    build: .
    image: docker.io/alirezaramezanzadeh/snirelay:0.4.0
    container_name: snirelay
    restart: unless-stopped
    network_mode: host
    # Host PID 1 for dnsmasq HUP + nsenter → host ufw
    pid: host
    privileged: true
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    env_file:
      - .env
    volumes:
      - ./snirelay.yaml:/etc/sniproxy/config.yaml
      - snirelay-data:/var/lib/snirelay
      - /etc/dnsmasq.d:/etc/dnsmasq.d
      - /etc/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - /var/log/dnsmasq:/var/log/dnsmasq:ro

volumes:
  snirelay-data:
