# SNIrelay — host network (SOCKS on 127.0.0.1 + ports 80/443)
#
# Usage:
#   1. Copy/edit config:  cp config/config.yaml ./snirelay.yaml
#   2. Set RELAY_IP / ADMIN_PASSWORD below
#   3. docker compose up -d --build
#
# Panel:  http://SERVER:9080/
# Metrics: http://SERVER:9090/metrics

services:
  snirelay:
    build: .
    image: snirelay:0.3.0
    container_name: snirelay
    restart: unless-stopped
    network_mode: host
    # So kill -HUP can signal host dnsmasq after Apply in the panel
    pid: host
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      CONFIG_FILE: /etc/sniproxy/config.yaml
      LOG_LEVEL: info
      PROXY: "socks5 127.0.0.1 10808"
      ADMIN_PASSWORD: "change-me"
      # Public IP clients use to reach this SNIrelay (written into dnsmasq snippets)
      RELAY_IP: "94.182.174.181"
      DNSMASQ_CONF_DIR: /etc/dnsmasq.d
      # Optional — auto-detected as the .conf with most address=/ and bypass.conf
      # DNSMASQ_RELAY_FILE: /etc/dnsmasq.d/routed.conf
      # DNSMASQ_BYPASS_FILE: /etc/dnsmasq.d/bypass.conf
      DNSMASQ_RELOAD_CMD: "kill -HUP $$(pidof dnsmasq)"
      # Host path must match dnsmasq log-facility=… (see README)
      DNSMASQ_QUERY_LOG: /var/log/dnsmasq/queries.log
      DNS_QUERY_RETAIN_HOURS: "72"
      PANEL_ENABLED: "true"
    volumes:
      - ./snirelay.yaml:/etc/sniproxy/config.yaml
      - snirelay-data:/var/lib/snirelay
      # Live read/write of host dnsmasq drop-ins
      - /etc/dnsmasq.d:/etc/dnsmasq.d
      - /etc/dnsmasq.conf:/etc/dnsmasq.conf:ro
      # dnsmasq query log (create dir + enable log-queries on the host)
      - /var/log/dnsmasq:/var/log/dnsmasq:ro
    # Optional: if Xray/SOCKS is not up yet, soft-fail probe keeps the container running
    # UPSTREAM_PROBE_REQUIRED: "false"

volumes:
  snirelay-data:
